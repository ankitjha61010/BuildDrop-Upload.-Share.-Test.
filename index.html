<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>BuildDrop — Upload. Share. Test.</title>
    <meta name="description" content="Production-grade, frontend-only high-speed file uploading and sharing platform backed directly by Google Drive and Netlify." />

    <!-- Open Graph / link-preview defaults. The /watch/:id edge function (netlify/edge-functions/social-meta.ts)
         rewrites the title/description with the specific build's own name/description for share links.
         og-image.png is a square logo card on purpose: link-unfurlers (Slack, WhatsApp, etc.) that only show
         a small cropped thumbnail crop it square, and a non-square source image gets cut off/distorted in
         that crop - a square source has nothing to crop away. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BuildDrop" />
    <meta property="og:title" content="BuildDrop — Upload. Share. Test." />
    <meta property="og:description" content="Production-grade, frontend-only high-speed file uploading and sharing platform backed directly by Google Drive and Netlify." />
    <meta property="og:image" content="https://builddrop.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BuildDrop — Upload. Share. Test." />
    <meta name="twitter:description" content="Production-grade, frontend-only high-speed file uploading and sharing platform backed directly by Google Drive and Netlify." />
    <meta name="twitter:image" content="https://builddrop.netlify.app/og-image.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0a0e17] text-slate-100 min-h-screen font-['Plus_Jakarta_Sans',sans-serif] selection:bg-indigo-500/30 selection:text-indigo-200 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
